name: Optimizar Imágenes

on:
  push:
    branches: [main]
    paths:
      - '**.jpg'
      - '**.jpeg'
      - '**.png'
      - '**.webp'
  workflow_dispatch:

# Permiso para que el bot pueda guardar las imágenes optimizadas
permissions:
  contents: write
  pull-requests: write

# Evita choques con el flujo del sitemap: se ejecutan en fila, no al mismo tiempo
concurrency:
  group: auto-commit-main
  cancel-in-progress: false

jobs:
  optimize-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # parte de la versión más reciente para poder guardar sin conflictos

      - name: Optimizar imágenes
        uses: calibreapp/image-actions@main
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          compressOnly: true   # No redimensiona, solo comprime
          jpegQuality: '82'
          pngQuality: '82'
          webpQuality: '82'

      - name: Commit imágenes optimizadas
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '🖼️ Imágenes optimizadas automáticamente'
          commit_user_name: 'github-actions[bot]'
