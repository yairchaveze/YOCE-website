name: Generar Sitemap

on:
  push:
    branches: [main]
    paths:
      - '**.html'
  workflow_dispatch:

# Permiso para que el bot pueda guardar sitemap.xml en el repositorio
permissions:
  contents: write

# Evita choques con el flujo de imágenes: se ejecutan en fila, no al mismo tiempo
concurrency:
  group: auto-commit-main
  cancel-in-progress: false

jobs:
  generate-sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # parte de la versión más reciente para poder guardar sin conflictos

      - name: Generar sitemap.xml
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://yocelltherapy.com/
          include-html: true
          exclude-paths: /google37673d14c4e8ed41.html   # excluye verificación de Google

      - name: Commit sitemap
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '🗺️ Sitemap actualizado automáticamente'
          commit_user_name: 'github-actions[bot]'
          file_pattern: sitemap.xml
