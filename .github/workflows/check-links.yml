name: Validar Links Rotos

on:
  schedule:
    - cron: '0 8 * * 1'  # Cada lunes a las 8am
  workflow_dispatch:       # Solo manual o semanal, no en cada push

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --verbose
            --no-progress
            --max-retries 3
            --root-dir ${{ github.workspace }}
            --accept '200..=299,403,429'
            --exclude-path 'google37673d14c4e8ed41.html'
            --exclude 'mailto:'
            --exclude 'linkedin.com'
            --exclude 'instagram.com'
            --exclude 'facebook.com'
            --exclude 'tiktok.com'
            --exclude 'fonts.googleapis.com'
            --exclude 'scholar.google.com'
            --exclude 'researchgate.net'
            --exclude 'formspree.io'
            --exclude 'forms.gle'
            --exclude 'uaz.edu.mx'
            --exclude 'paypal.me'
            --exclude 'fonts.gstatic.com'
            --exclude 'www.w3.org'
            --exclude 'script.google.com'
            --exclude 'streamlit.app'
            --exclude 'wa.me'
            --exclude 'amazon.com'
            --exclude 'ascopubs.org'
            --exclude 'youtube.com'
            './**/*.html'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mostrar links rotos como avisos
        if: failure()
        run: |
          grep -E '\[(ERROR|[0-9]{3})\]|✗|\[TIMEOUT\]' lychee/out.md | head -50 | while IFS= read -r line; do
            echo "::error title=Link roto::$line"
          done || true

      - name: Crear reporte si hay errores
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-links-rotos
          path: lychee/out.md
